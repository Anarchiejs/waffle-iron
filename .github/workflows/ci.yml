name: CI

on:
  push:
  pull_request:

jobs:
  cpu:
    name: Windows CPU
    runs-on: windows-latest
    steps:
      - name: Récupérer les sources
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Environnement MSVC
        uses: ilammy/msvc-dev-cmd@v1

      - name: vcpkg du runner
        shell: pwsh
        run: |
          $root = $env:VCPKG_INSTALLATION_ROOT
          if (-not $root) { $root = $env:VCPKG_ROOT }
          if (-not $root -and (Test-Path 'C:\vcpkg\vcpkg.exe')) { $root = 'C:\vcpkg' }
          if (-not $root) { throw 'vcpkg introuvable (VCPKG_INSTALLATION_ROOT ou VCPKG_ROOT)' }
          Add-Content -Path $env:GITHUB_ENV -Value "VCPKG_ROOT=$root"
          Write-Host "VCPKG_ROOT=$root"

      - name: Cache binaire vcpkg
        uses: actions/cache@v4
        with:
          path: vcpkg_installed
          key: vcpkg-${{ runner.os }}-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json') }}

      - name: Configurer
        run: cmake --preset cpu-release

      - name: Compiler
        run: cmake --build --preset cpu-release --parallel 4

      - name: Tester
        run: ctest --preset cpu-release
