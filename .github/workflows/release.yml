name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  changelog:
    name: Changelog section
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out sources
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Require a matching section
        run: |
          tag="${GITHUB_REF_NAME#v}"
          if ! grep -q "^## ${tag}$" CHANGELOG.md; then
            echo "CHANGELOG.md has no section '## ${tag}'"
            exit 1
          fi

  windows:
    name: Windows package
    needs: changelog
    runs-on: windows-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          submodules: recursive
      - uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0
      - name: Runner vcpkg
        shell: pwsh
        run: |
          $root = $env:VCPKG_INSTALLATION_ROOT
          if (-not $root) { $root = $env:VCPKG_ROOT }
          if (-not $root -and (Test-Path 'C:\vcpkg\vcpkg.exe')) { $root = 'C:\vcpkg' }
          if (-not $root) { throw 'vcpkg not found' }
          $baseline = [string](Get-Content -Raw vcpkg.json | ConvertFrom-Json).'builtin-baseline'
          git -C $root fetch --depth=1 origin $baseline
          Add-Content -Path $env:GITHUB_ENV -Value "VCPKG_ROOT=$root"
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: vcpkg_installed
          key: vcpkg-${{ runner.os }}-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json') }}
      - run: cmake --preset cpu-release -DGGML_NATIVE=OFF
      - run: cmake --build --preset cpu-release --parallel 4
      - run: ctest --preset cpu-release
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: waffle-windows
          path: |
            build/cpu-release/waffle.exe
            build/cpu-release/WaffleIron.exe
            build/cpu-release/assets
            NOTICE
            LICENSE
            THIRD_PARTY.md

  linux:
    name: Linux package
    needs: changelog
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          submodules: recursive
      - name: Build packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ninja-build pkg-config zip \
            autoconf autoconf-archive automake libtool xutils-dev \
            libgl1-mesa-dev libglu1-mesa-dev \
            libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev \
            libxi-dev libxext-dev libxxf86vm-dev
      - name: vcpkg
        run: |
          baseline=$(python3 -c 'import json; print(json.load(open("vcpkg.json"))["builtin-baseline"])')
          git clone --filter=blob:none https://github.com/microsoft/vcpkg.git "$RUNNER_TEMP/vcpkg"
          git -C "$RUNNER_TEMP/vcpkg" fetch --depth 1 origin "$baseline"
          git -C "$RUNNER_TEMP/vcpkg" checkout --detach FETCH_HEAD
          "$RUNNER_TEMP/vcpkg/bootstrap-vcpkg.sh" -disableMetrics
          echo "VCPKG_ROOT=$RUNNER_TEMP/vcpkg" >> "$GITHUB_ENV"
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: vcpkg_installed
          key: vcpkg-${{ runner.os }}-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json') }}
      - run: cmake --preset cpu-release -DGGML_NATIVE=OFF
      - run: cmake --build --preset cpu-release --parallel 4
      - run: ctest --preset cpu-release
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: waffle-linux
          path: |
            build/cpu-release/waffle
            build/cpu-release/WaffleIron
            build/cpu-release/assets
            NOTICE
            LICENSE
            THIRD_PARTY.md

  macos:
    name: macOS package
    needs: changelog
    runs-on: macos-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          submodules: recursive
      - name: Build tools
        run: |
          if ! command -v ninja >/dev/null 2>&1; then brew install ninja; fi
          if ! command -v cmake >/dev/null 2>&1; then brew install cmake; fi
      - name: vcpkg
        run: |
          baseline=$(python3 -c 'import json; print(json.load(open("vcpkg.json"))["builtin-baseline"])')
          git clone --filter=blob:none https://github.com/microsoft/vcpkg.git "$RUNNER_TEMP/vcpkg"
          git -C "$RUNNER_TEMP/vcpkg" fetch --depth 1 origin "$baseline"
          git -C "$RUNNER_TEMP/vcpkg" checkout --detach FETCH_HEAD
          "$RUNNER_TEMP/vcpkg/bootstrap-vcpkg.sh" -disableMetrics
          echo "VCPKG_ROOT=$RUNNER_TEMP/vcpkg" >> "$GITHUB_ENV"
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: vcpkg_installed
          key: vcpkg-${{ runner.os }}-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json') }}
      - run: cmake --preset cpu-release -DGGML_NATIVE=OFF
      - run: cmake --build --preset cpu-release --parallel 4
      - run: ctest --preset cpu-release
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: waffle-macos
          path: |
            build/cpu-release/waffle
            build/cpu-release/WaffleIron
            build/cpu-release/assets
            NOTICE
            LICENSE
            THIRD_PARTY.md

  publish:
    name: Publish
    needs: [windows, linux, macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: dist
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${GITHUB_REF_NAME}"
          gh release create "$tag" dist/waffle-windows/* dist/waffle-linux/* dist/waffle-macos/* \
            --title "$tag" \
            --notes "Packages built from ${tag}. See CHANGELOG.md."
